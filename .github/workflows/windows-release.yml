name: Build Windows TES3MP release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event.forced != true
    runs-on: windows-2022

    steps:
      - name: Check out TES3MP
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check out matching CrabNet
        uses: actions/checkout@v7
        with:
          repository: TES3MP/CrabNet
          ref: 19e66190e83f53bcdcbcd6513238ed2e54878a21
          path: deps/CrabNet

      - name: Check out matching CoreScripts
        uses: actions/checkout@v7
        with:
          repository: TES3MP/CoreScripts
          ref: 0.8.1
          path: deps/CoreScripts

      - name: Check out LuaJIT
        uses: actions/checkout@v7
        with:
          repository: LuaJIT/LuaJIT
          ref: v2.1
          path: deps/LuaJIT

      - name: Check out matching Lua CJSON
        uses: actions/checkout@v7
        with:
          repository: TES3MP/lua-cjson
          ref: c3abdb769ffd88c74d8c421d49af9f5d2c8cf845
          path: deps/Lua-CJSON

      - name: Check out Lua io2
        uses: actions/checkout@v7
        with:
          repository: TES3MP/Lua-io2
          ref: 4f132ff9d0208267b37936dd17253bb540970489
          path: deps/Lua-io2
          submodules: recursive

      - name: Set up compatible CMake
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CMake 3.31
        shell: pwsh
        run: python -m pip install cmake==3.31.10

      - name: Ensure the VS 2019-compatible toolset is available
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $installPath) { throw 'Visual Studio installation was not found.' }
          $toolset = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 -property installationPath
          if (-not $toolset) {
            & $installer modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64 --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) { throw "Installing the v142 toolset failed with exit code $LASTEXITCODE." }
          }

      - name: Build CrabNet
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps\raknet'
          cmake -S deps/CrabNet -B deps/CrabNet/build -A x64 -T v142 `
            -DCRABNET_ENABLE_DLL=OFF `
            -DCRABNET_ENABLE_STATIC=ON `
            "-DCMAKE_INSTALL_PREFIX=$prefix"
          if ($LASTEXITCODE -ne 0) { throw 'CrabNet configuration failed.' }
          cmake --build deps/CrabNet/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'CrabNet build failed.' }
          cmake --install deps/CrabNet/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'CrabNet install failed.' }
          cmake --build deps/CrabNet/build --config Debug --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'CrabNet Debug build failed.' }
          cmake --install deps/CrabNet/build --config Debug
          if ($LASTEXITCODE -ne 0) { throw 'CrabNet Debug install failed.' }

      - name: Build LuaJIT
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products '*' -property installationPath
          $devCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
          $luaSrc = (Resolve-Path 'deps\LuaJIT\src').Path
          @"
          call "$devCmd" -no_logo -arch=amd64 -host_arch=amd64 -vcvars_ver=14.2
          if errorlevel 1 exit /b %errorlevel%
          cd /d "$luaSrc"
          call msvcbuild.bat
          exit /b %errorlevel%
          "@ | Set-Content build-luajit.cmd -Encoding ascii
          & $env:ComSpec /d /c build-luajit.cmd
          if ($LASTEXITCODE -ne 0) { throw 'LuaJIT build failed.' }

          $prefix = Join-Path $env:GITHUB_WORKSPACE 'deps\LuaJIT-install'
          New-Item -ItemType Directory -Force -Path "$prefix\include", "$prefix\lib", "$prefix\bin" | Out-Null
          Copy-Item 'deps\LuaJIT\src\*.h' "$prefix\include"
          Copy-Item 'deps\LuaJIT\src\lua.hpp' "$prefix\include"
          Copy-Item 'deps\LuaJIT\src\lua51.lib' "$prefix\lib"
          Copy-Item 'deps\LuaJIT\src\lua51.dll' "$prefix\bin"
          "LUAJIT_HOME=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Lua CJSON
        shell: pwsh
        run: |
          $luaPrefix = Join-Path $env:GITHUB_WORKSPACE 'deps\LuaJIT-install'
          $moduleDir = Join-Path $env:GITHUB_WORKSPACE 'deps\Lua-CJSON\cmake'
          New-Item -ItemType Directory -Force -Path $moduleDir | Out-Null
          $moduleDirCmake = $moduleDir.Replace('\', '/')
          $luaIncludeCmake = (Join-Path $luaPrefix 'include').Replace('\', '/')
          $luaLibraryCmake = (Join-Path $luaPrefix 'lib\lua51.lib').Replace('\', '/')
          @"
          set(Lua51_FOUND TRUE)
          set(LUA51_FOUND TRUE)
          set(LUA_INCLUDE_DIR "$luaIncludeCmake")
          set(LUA_LIBRARY "$luaLibraryCmake")
          set(LUA_LIBRARIES "$luaLibraryCmake")
          "@ | Set-Content -Path (Join-Path $moduleDir 'FindLua51.cmake') -Encoding utf8NoBOM

          # CMake's WINDOWS_EXPORT_ALL_SYMBOLS does not reliably export the Lua
          # entry point from this MODULE target. Give the linker an explicit export.
          @"
          LIBRARY cjson
          EXPORTS
              luaopen_cjson
          "@ | Set-Content -Path (Join-Path 'deps\Lua-CJSON' 'cjson.def') -Encoding ascii
          Add-Content -Path 'deps\Lua-CJSON\CMakeLists.txt' -Value 'target_sources(cjson PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/cjson.def")'

          cmake -S deps/Lua-CJSON -B deps/Lua-CJSON/build -A x64 -T v142 `
            "-DCMAKE_MODULE_PATH=$moduleDirCmake" `
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Lua CJSON configuration failed.' }
          cmake --build deps/Lua-CJSON/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Lua CJSON build failed.' }
          $cjsonDll = 'deps\Lua-CJSON\build\Release\cjson.dll'
          if (-not (Test-Path $cjsonDll)) { throw 'Lua CJSON build did not produce cjson.dll.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $installPath 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found to verify the CJSON module export.' }
          $exports = & $dumpbin.FullName /nologo /exports $cjsonDll 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $exports -notmatch 'luaopen_cjson') {
            throw 'Lua CJSON DLL does not export luaopen_cjson.'
          }

      - name: Build Lua io2 module
        shell: pwsh
        run: |
          $luaPrefix = Join-Path $env:GITHUB_WORKSPACE 'deps\LuaJIT-install'
          $io2SourcePath = 'deps\Lua-io2\library.cpp'
          $io2Source = Get-Content $io2SourcePath -Raw
          # The pinned Lua-io2 revision predates std::filesystem and otherwise falls back to Boost.
          if (-not $io2Source.Contains('#include <experimental/filesystem>') -or
              -not $io2Source.Contains('std::experimental::filesystem')) {
            throw 'The pinned Lua io2 filesystem implementation changed unexpectedly.'
          }
          $io2Source = $io2Source.Replace('#include <experimental/filesystem>', '#include <filesystem>')
          $io2Source = $io2Source.Replace('std::experimental::filesystem', 'std::filesystem')
          Set-Content -Path $io2SourcePath -Value $io2Source -Encoding utf8NoBOM -NoNewline

          cmake -S deps/Lua-io2 -B deps/Lua-io2/build -A x64 -T v142 `
            "-DLuaJit_INCLUDE_DIR=$luaPrefix/include" `
            "-DLuaJit_LIBRARY=$luaPrefix/lib/lua51.lib" `
            -DHAVE_FILESYSTEM_H=TRUE
          if ($LASTEXITCODE -ne 0) { throw 'Lua io2 configuration failed.' }
          cmake --build deps/Lua-io2/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Lua io2 build failed.' }
          if (-not (Test-Path 'deps\Lua-io2\build\Release\io2.dll')) { throw 'Lua io2 build did not produce io2.dll.' }

      - name: Configure TES3MP
        shell: bash
        run: |
          export RAKNET_ROOT="$(cygpath -m "$GITHUB_WORKSPACE/deps/raknet")"
          export LUAJIT_HOME="$(cygpath -m "$LUAJIT_HOME")"
          export TES3MP_RELEASE_BUILD=1
          bash CI/before_script.msvc.sh -c Release -p Win64 -v 2022 -V -i "$GITHUB_WORKSPACE/install"

      - name: Build client and server
        shell: pwsh
        run: |
          cmake --build MSVC2022_64 --config Release --target tes3mp tes3mp-server --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'TES3MP build failed.' }

      - name: Build launcher, wizard, and server browser
        shell: pwsh
        run: |
          cmake --build MSVC2022_64 --config Release --target openmw-launcher openmw-wizard openmw-iniimporter tes3mp-browser --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'TES3MP support applications build failed.' }

      - name: Install TES3MP
        shell: pwsh
        run: |
          cmake --install MSVC2022_64 --config Release
          if ($LASTEXITCODE -ne 0) { throw 'TES3MP install failed.' }
          Copy-Item 'MSVC2022_64\Release\tes3mp-server.exe' 'install'
          Copy-Item 'deps\LuaJIT-install\bin\lua51.dll' 'install'

      - name: Assemble release ZIP
        shell: pwsh
        run: |
          $serverDir = Join-Path $env:GITHUB_WORKSPACE 'install\server'
          New-Item -ItemType Directory -Force -Path $serverDir | Out-Null
          foreach ($folder in @('data', 'lib', 'scripts')) {
            Copy-Item "deps\CoreScripts\$folder" $serverDir -Recurse
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $serverDir 'data\map') | Out-Null

          $serverLibDir = Join-Path $serverDir 'lib'
          New-Item -ItemType Directory -Force -Path $serverLibDir | Out-Null
          Copy-Item 'deps\Lua-CJSON\build\Release\cjson.dll' $serverLibDir
          Copy-Item 'deps\Lua-CJSON\LICENSE' (Join-Path $serverLibDir 'lua-cjson-LICENSE.txt')
          Copy-Item 'deps\Lua-io2\build\Release\io2.dll' $serverLibDir
          Copy-Item 'deps\Lua-io2\LICENSE' (Join-Path $serverLibDir 'lua-io2-LICENSE.txt')

          $customDir = Join-Path $serverDir 'scripts\custom'
          New-Item -ItemType Directory -Force -Path $customDir | Out-Null
          Copy-Item server-scripts/custom/localMapPersistence.lua $customDir
          Copy-Item server-scripts/custom/friendlyFire.lua $customDir
          Copy-Item server-scripts/custom/topicJournalPersistence.lua $customDir
          Copy-Item server-scripts/custom/npcDispositionPersistence.lua $customDir

          $customScripts = Join-Path $serverDir 'scripts\customScripts.lua'
          if (-not (Test-Path $customScripts)) { throw 'CoreScripts customScripts.lua was not found.' }
          foreach ($requireLine in @(
            'require("custom/localMapPersistence")',
            'require("custom/friendlyFire")',
            'require("custom/topicJournalPersistence")',
            'require("custom/npcDispositionPersistence")'
          )) {
            if (-not (Select-String -Path $customScripts -SimpleMatch $requireLine -Quiet)) {
              Add-Content -Path $customScripts -Value $requireLine
            }
          }

          $configFile = Join-Path $serverDir 'scripts\config.lua'
          if (-not (Test-Path $configFile)) { throw 'CoreScripts config.lua was not found.' }
          $dispositionSetting = 'config.persistNpcDispositions = true'
          $friendlyFireSetting = 'config.friendlyFire = true'
          $configLines = [System.Collections.Generic.List[string]]::new()
          $configLines.AddRange([string[]](Get-Content -Path $configFile))
          if (-not ($configLines -contains $dispositionSetting)) {
            $shareKillsIndex = -1
            for ($i = 0; $i -lt $configLines.Count; $i++) {
              if ($configLines[$i] -match '^\s*config\.shareKills\s*=') {
                $shareKillsIndex = $i
                break
              }
            }
            if ($shareKillsIndex -lt 0) { throw 'CoreScripts config.lua does not contain config.shareKills.' }
            $configLines.InsertRange($shareKillsIndex + 1, [string[]]@(
              '',
              '-- Whether NPC dispositions should persist independently for each player',
              $dispositionSetting
            ))
          }
          if (-not ($configLines -contains $friendlyFireSetting)) {
            $dispositionIndex = $configLines.IndexOf($dispositionSetting)
            if ($dispositionIndex -lt 0) { throw 'Could not find the NPC disposition setting in config.lua.' }
            $configLines.InsertRange($dispositionIndex + 1, [string[]]@(
              '',
              '-- Whether players can damage allied/friendly players',
              $friendlyFireSetting
            ))
          }
          if (-not (Select-String -Path $configFile -SimpleMatch $dispositionSetting -Quiet) -or
              -not (Select-String -Path $configFile -SimpleMatch $friendlyFireSetting -Quiet)) {
            Set-Content -Path $configFile -Value $configLines -Encoding utf8
          }

          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "manual-$($env:GITHUB_SHA.Substring(0, 7))" }
          $zip = "tes3mp.Win64.release.$tag.zip"
          Compress-Archive -Path 'install\*' -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v7
        with:
          name: TES3MP-Windows-x64
          path: tes3mp.Win64.release.*.zip
          if-no-files-found: error

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: TES3MP ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: tes3mp.Win64.release.*.zip
